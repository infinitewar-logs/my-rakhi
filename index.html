<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive 3D Rakhi & Polaroid Wall</title>
    <!-- Google Fonts for Polaroid Captions -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #0d0d0d;
        color: #ffffff;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        overflow-x: hidden;
      }

      /* Hero Section / Canvas Container */
      #canvas-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at center, #1a0808 0%, #050202 100%);
        touch-action: none; /* Prevents scroll interference on touch drag */
      }

      .hero-title {
        position: absolute;
        top: 5%;
        width: 100%;
        text-align: center;
        pointer-events: none;
        z-index: 10;
      }

      .hero-title h1 {
        font-size: clamp(1.8rem, 4vw, 3rem);
        background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 1px;
        text-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
      }

      .hero-title p {
        font-size: clamp(0.85rem, 1.5vw, 1.1rem);
        color: #a1a1aa;
        margin-top: 0.5rem;
      }

      /* Polaroid Wall Gallery Section */
      #polaroid-wall {
        padding: 5rem 2rem 6rem;
        background: #121212;
        border-top: 1px solid #222;
        box-shadow: inset 0 20px 30px rgba(0, 0, 0, 0.8);
      }

      .gallery-header {
        text-align: center;
        margin-bottom: 3.5rem;
      }

      .gallery-header h2 {
        font-size: 2rem;
        color: #ffd700;
        letter-spacing: 1px;
      }

      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 3rem;
        max-width: 1200px;
        margin: 0 auto;
        justify-items: center;
      }

      /* Polaroid Card Styling */
      .polaroid {
        background: #ffffff;
        padding: 12px 12px 24px 12px;
        border-radius: 4px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
        width: 100%;
        max-width: 260px;
        cursor: pointer;
      }

      .polaroid-img-wrapper {
        width: 100%;
        aspect-ratio: 1 / 1;
        overflow: hidden;
        background-color: #eee;
      }

      .polaroid img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .polaroid-caption {
        font-family: "Caveat", cursive;
        font-size: 1.5rem;
        color: #222222;
        text-align: center;
        margin-top: 1rem;
        line-height: 1.2;
      }

      /* Subtle Random Rotation & Hover Effects */
      .polaroid:nth-child(1) {
        transform: rotate(-3deg);
      }
      .polaroid:nth-child(2) {
        transform: rotate(2deg);
      }
      .polaroid:nth-child(3) {
        transform: rotate(-2deg);
      }
      .polaroid:nth-child(4) {
        transform: rotate(4deg);
      }
      .polaroid:nth-child(5) {
        transform: rotate(-4deg);
      }
      .polaroid:nth-child(6) {
        transform: rotate(3deg);
      }

      .polaroid:hover {
        transform: scale(1.08) rotate(0deg) !important;
        box-shadow: 0 15px 35px rgba(255, 140, 0, 0.2);
        z-index: 10;
      }
    </style>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  </head>
  <body>

    <!-- Polaroid Wall Section -->
     <div>

  
    <section id="polaroid-wall">
      <div class="gallery-header">
        <h2>Memories Wall</h2>
      </div>

      <div class="gallery-grid">
        <div class="polaroid">
          <div class="polaroid-img-wrapper">
            <img src="/img/shenanigans.jpg" />
          </div>
          <div class="polaroid-caption">Childhood Shenanigans</div>
        </div>

        <div class="polaroid">
          <div class="polaroid-img-wrapper">
            <img src="/img/rakhi time.jpg" />
          </div>
          <div class="polaroid-caption">Lighting Diya's and having fun</div>
        </div>

        <div class="polaroid">
          <div class="polaroid-img-wrapper">
            <img src="/img/junk food table.jpg" />
          </div>
          <div class="polaroid-caption">The Big Junk food appitiet </div>
        </div>


        <div class="polaroid">
          <div class="polaroid-img-wrapper">
            <img src="/img/icecream.jpg" />
          </div>
          <div class="polaroid-caption">Sweet Moments of discussing hobbies</div>
        </div>

    </div>

    <div id="canvas-container">
        <div class="hero-title">
          <h1>Happy Raksha Bandhan</h1>
          <p>Move cursor or drag across the screen to rotate</p>
        </div>
      </div>


    <!-- Three.js Logic -->
    <script>
      // --- 1. Scene, Camera, & Renderer Setup ---
      const container = document.getElementById("canvas-container");
      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(
        45,
        container.clientWidth / container.clientHeight,
        0.1,
        1000,
      );
      camera.position.z = 10;

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
      });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // --- 2. Lighting Setup ---
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
      mainLight.position.set(5, 5, 7);
      scene.add(mainLight);

      const pointLight = new THREE.PointLight(0xff9900, 1.5, 20);
      pointLight.position.set(-3, -2, 3);
      scene.add(pointLight);

      // --- 3. Constructing the 3D Rakhi ---
      const rakhiGroup = new THREE.Group();

      // Materials
      const goldMaterial = new THREE.MeshStandardMaterial({
        color: 0xffd700,
        metalness: 0.85,
        roughness: 0.2,
        emissive: 0x332200,
      });

      const crimsonMaterial = new THREE.MeshStandardMaterial({
        color: 0xdc143c,
        roughness: 0.4,
        metalness: 0.1,
      });

      const saffronMaterial = new THREE.MeshStandardMaterial({
        color: 0xff8c00,
        roughness: 0.3,
      });

      // A. Thread / Band (Left and Right Torus Tubing)
      const threadGeo = new THREE.TorusGeometry(3.5, 0.08, 16, 100);

      // Left Thread Curve
      const leftThread = new THREE.Mesh(threadGeo, saffronMaterial);
      leftThread.scale.set(1, 0.05, 1);
      leftThread.position.x = -3.5;
      rakhiGroup.add(leftThread);

      // Right Thread Curve
      const rightThread = new THREE.Mesh(threadGeo, saffronMaterial);
      rightThread.scale.set(1, 0.05, 1);
      rightThread.position.x = 3.5;
      rakhiGroup.add(rightThread);

      // B. Center Base Dial (Cylinder with Red & Gold Layers)
      const baseGeo = new THREE.CylinderGeometry(1.8, 1.8, 0.1, 64);
      const baseDial = new THREE.Mesh(baseGeo, crimsonMaterial);
      baseDial.rotation.x = Math.PI / 2;
      rakhiGroup.add(baseDial);

      const goldRingGeo = new THREE.TorusGeometry(1.6, 0.08, 16, 64);
      const goldRing = new THREE.Mesh(goldRingGeo, goldMaterial);
      goldRing.position.z = 0.06;
      rakhiGroup.add(goldRing);

      // C. Top Ornamentation (Petals & Beads)
      const petalCount = 12;
      for (let i = 0; i < petalCount; i++) {
        const angle = (i / petalCount) * Math.PI * 2;
        const radius = 1.1;

        // Outer Gold Beads
        const beadGeo = new THREE.SphereGeometry(0.15, 16, 16);
        const bead = new THREE.Mesh(beadGeo, goldMaterial);
        bead.position.set(
          Math.cos(angle) * radius,
          Math.sin(angle) * radius,
          0.12,
        );
        rakhiGroup.add(bead);

        // Inner Decorative Ring (Faceted Cones)
        const coneGeo = new THREE.ConeGeometry(0.18, 0.4, 5);
        const cone = new THREE.Mesh(coneGeo, saffronMaterial);
        cone.position.set(Math.cos(angle) * 0.6, Math.sin(angle) * 0.6, 0.18);
        cone.rotation.z = angle - Math.PI / 2;
        cone.rotation.x = Math.PI / 2;
        rakhiGroup.add(cone);
      }

      // Central Gem Focus
      const centerGemGeo = new THREE.SphereGeometry(0.35, 32, 32);
      centerGemGeo.scale(1, 1, 0.5);
      const centerGem = new THREE.Mesh(centerGemGeo, goldMaterial);
      centerGem.position.z = 0.22;
      rakhiGroup.add(centerGem);

      scene.add(rakhiGroup);

      // --- 4. Interactive Cursor & Touch Logic ---
      let targetRotationX = 0;
      let targetRotationY = 0;
      let mouseX = 0;
      let mouseY = 0;

      const windowHalfX = window.innerWidth / 2;
      const windowHalfY = window.innerHeight / 2;

      // Mouse Tracking
      function onPointerMove(event) {
        mouseX = (event.clientX - windowHalfX) / windowHalfX;
        mouseY = (event.clientY - windowHalfY) / windowHalfY;

        targetRotationY = mouseX * 0.8;
        targetRotationX = mouseY * 0.8;
      }

      // Touch Tracking
      function onTouchMove(event) {
        if (event.touches.length > 0) {
          mouseX = (event.touches[0].clientX - windowHalfX) / windowHalfX;
          mouseY = (event.touches[0].clientY - windowHalfY) / windowHalfY;

          targetRotationY = mouseX * 0.8;
          targetRotationX = mouseY * 0.8;
        }
      }

      container.addEventListener("mousemove", onPointerMove);
      container.addEventListener("touchmove", onTouchMove, { passive: true });

      // --- 5. Responsive Resize Handling ---
      window.addEventListener("resize", () => {
        const width = container.clientWidth;
        const height = container.clientHeight;

        camera.aspect = width / height;
        camera.updateProjectionMatrix();

        renderer.setSize(width, height);
      });

      // --- 6. Animation Loop ---
      function animate() {
        requestAnimationFrame(animate);

        // Smooth Interpolation (Lerp)
        rakhiGroup.rotation.y +=
          (targetRotationY - rakhiGroup.rotation.y) * 0.05;
        rakhiGroup.rotation.x +=
          (targetRotationX - rakhiGroup.rotation.x) * 0.05;

        // Continuous Idle Pulse/Float
        rakhiGroup.position.y = Math.sin(Date.now() * 0.0015) * 0.15;

        renderer.render(scene, camera);
      }

      animate();
    </script>
  </body>
</html>
